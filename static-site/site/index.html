<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Static site on Nerdit</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           font: 16px/1.5 system-ui, sans-serif; background: #101418; color: #e6e9ec; }
    main { max-width: 40rem; padding: 2rem; }
    h1 { font-size: 2rem; margin: 0 0 .5rem; }
    code { background: #1b2128; padding: .1rem .35rem; border-radius: .25rem; }
    p { color: #aab3bd; }
  </style>
</head>
<body>
  <main>
    <h1>It works.</h1>
    <p>This page is served by <code>nginx-unprivileged</code> on port 8080 from
       <code>site/index.html</code>. Replace the files under <code>site/</code>
       and redeploy.</p>
  </main>
</body>
</html>
